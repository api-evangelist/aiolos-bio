aid: aiolos-bio
name: Aiolos Bio
description: >-
  Aiolos Bio was a clinical-stage biopharmaceutical company founded in 2023 with offices in San
  Francisco, California and London, United Kingdom, developing treatments for respiratory and
  inflammatory disease. Its sole disclosed asset was AIO-001, a half-life-extended monoclonal
  antibody against thymic stromal lymphopoietin (TSLP), positioned as a Phase 2-ready candidate
  for moderate-to-severe asthma with potential six-month dosing intervals. The company launched
  in October 2023 with an oversubscribed $245 million Series A co-led by Atlas Venture, Bain
  Capital Life Sciences, Forbion and Sofinnova Investments, with RA Capital Management. GSK plc
  agreed to acquire it on 9 January 2024 for $1 billion upfront plus up to $400 million in
  milestones, completing on 14 February 2024. Aiolos Bio is a drug developer, not a software
  vendor: it never ran a developer program, public API, SDK or machine-readable contract, and
  aiolosbio.com now serves a blanket HTTP 301 to www.gsk.com on every path.
